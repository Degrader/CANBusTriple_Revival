; CANBus Triple - PlatformIO project
; Repackaged from the original Arduino-IDE-1.6.1 "hardware/" layout.
; The custom board definition lives in boards/canbustriple.json and the
; custom pin mapping in variants/canbustriple/pins_arduino.h - both carried
; over from the original repo. Everything else (AVR core, SPI/EEPROM/Wire)
; now comes from PlatformIO's current, maintained atmelavr platform instead
; of the frozen 2016 copies that used to be bundled here.

[env:canbustriple]
platform = atmelavr
board = canbustriple
framework = arduino

board_build.variant = canbustriple
board_build.variants_dir = variants

lib_extra_dirs = lib
lib_ldf_mode = deep+

monitor_speed = 115200
upload_speed = 57600
